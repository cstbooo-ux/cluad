<html><head><meta charset="utf-8"><title>线性代数：AI 的母语</title>

<canvas id="c" width="1920" height="1080"></canvas>

<script>
// open anim.html?play through a local http server for a realtime preview with music (click to start)
if (location.search.includes('play')) window.ready.then(() => {
  const a = new Audio('build/music.wav'); let started = false;
  document.body.onclick = () => { a.play(); started = true; };
  (function loop() { renderFrame(started ? a.currentTime : 0); requestAnimationFrame(loop); })();
});
</script>
